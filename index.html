<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>راية | رصد الغياب — ابن خلدون الابتدائية وخزيمة بن ثابت المتوسطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --navy:#102a43;
  --teal:#0f766e;
  --gold:#eab308;
  --bg1:#f6fafc;
  --bg2:#edf7f5;
  --text:#183247;
  --white:#ffffff;
  --danger:#dc2626;
  --danger-bg:#fef2f2;
  --success:#16a34a;
  --success-bg:#f0fdf4;
  --line:#dbe6ec;
  --radius:16px;
  --shadow:0 8px 24px -8px rgba(16,42,67,.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Cairo',sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text);
  min-height:100vh;
  direction:rtl;
}
button, input, select{font-family:inherit; font-size:1rem;}
button{cursor:pointer; border:none; background:none;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--gold); color:var(--navy);}


/* ---------- Dual calendar display: Hijri first, Gregorian below ---------- */
.dual-date{display:inline-flex;flex-direction:column;align-items:center;gap:1px;line-height:1.35;vertical-align:middle;}
.dual-hijri{font-weight:800;color:inherit;}
.dual-greg{font-size:.72em;font-weight:600;color:#64748b;}
.scan-head .dual-greg{color:#cfe0e8;}
.notify-head .dual-date{font-size:.9em;}
@media print{.dual-greg{color:#64748b !important;}}

/* ---------- Header ---------- */
.topbar{
  background:var(--navy);
  color:#fff;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
  box-shadow:0 4px 18px -6px rgba(0,0,0,.35);
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:44px; height:44px; border-radius:12px;
  background:linear-gradient(135deg,var(--teal),var(--navy));
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:1.3rem; color:var(--gold);
  border:2px solid rgba(234,179,8,.5);
}
.brand-text h1{font-size:1.05rem; font-weight:800; letter-spacing:.2px;}
.brand-text p{font-size:.75rem; color:#c7d7e0; font-weight:500;}
.clock{
  display:flex; align-items:center; gap:14px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  padding:8px 16px; border-radius:12px;
  font-size:.85rem;
}
.clock .time{font-size:1.15rem; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums;}
.clock .dates{display:flex; flex-direction:column; gap:2px; color:#dce9ee; line-height:1.3;}
.topnav{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.nav-btn{
  color:#e7eff3; padding:8px 14px; border-radius:10px; font-weight:600; font-size:.9rem;
  transition:background .15s;
}
.nav-btn:hover{background:rgba(255,255,255,.1);}
.nav-btn.active{background:var(--teal); color:#fff;}
.user-chip{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.08); padding:6px 12px; border-radius:999px;
  font-size:.85rem;
}
.user-chip .dot{width:8px; height:8px; border-radius:50%; background:var(--gold);}
.logout-btn{color:#f2b8b8; font-weight:700; font-size:.85rem;}
.notify-wrap{position:relative;}
.notify-btn{position:relative;color:#e7eff3;padding:8px 12px;border-radius:10px;font-size:1.05rem;}
.notify-btn:hover{background:rgba(255,255,255,.1);}
.notify-badge{position:absolute;top:2px;left:3px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--navy);}
.notify-panel{position:absolute;top:46px;right:0;width:320px;max-width:calc(100vw - 30px);background:#fff;color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -12px rgba(16,42,67,.3);display:none;overflow:hidden;z-index:80;}
.notify-panel.open{display:block;}
.notify-head{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy);display:flex;justify-content:space-between;gap:8px;}
.notify-item{padding:11px 14px;border-bottom:1px solid #eef2f4;font-size:.78rem;line-height:1.7;}
.notify-item:last-child{border-bottom:0;}
.notify-empty{padding:18px 14px;text-align:center;color:#8299a6;font-size:.8rem;}

/* ---------- Layout ---------- */
.container{max-width:1240px; margin:0 auto; padding:26px 20px 60px;}
.page-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
.page-title h2{font-size:1.4rem; font-weight:800; color:var(--navy);}
.page-title p{color:#5b7382; font-size:.9rem;}

/* ---------- Stat cards ---------- */
.stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px;}
@media(max-width:800px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{
  background:#fff; border-radius:var(--radius); padding:18px 20px;
  box-shadow:var(--shadow); border-top:4px solid var(--teal);
  display:flex; flex-direction:column; gap:6px;
}
.stat-card.gold{border-top-color:var(--gold);}
.stat-card.danger{border-top-color:var(--danger);}
.stat-card.navy{border-top-color:var(--navy);}
.stat-card .num{font-size:1.9rem; font-weight:800; color:var(--navy);}
.stat-card .lbl{color:#5b7382; font-size:.85rem; font-weight:600;}

/* ---------- Class cards ---------- */
.classes-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px;}
.class-card{
  background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; display:flex; flex-direction:column;
}
.class-card .cc-top{height:6px; background:linear-gradient(90deg,var(--teal),var(--navy));}
.class-card .cc-body{padding:18px; display:flex; flex-direction:column; gap:12px;}
.cc-head{display:flex; align-items:center; justify-content:space-between;}
.cc-head h3{font-size:1.05rem; font-weight:800; color:var(--navy);}
.cc-menu{position:relative;}
.cc-menu-btn{color:#8299a6; font-size:1.2rem; padding:2px 8px; border-radius:6px;}
.cc-menu-btn:hover{background:#eef3f5;}
.cc-menu-list{
  position:absolute; left:0; top:28px; background:#fff; border-radius:10px;
  box-shadow:var(--shadow); border:1px solid var(--line); min-width:140px; z-index:10; display:none; overflow:hidden;
}
.cc-menu-list.open{display:block;}
.cc-menu-list button{display:block; width:100%; text-align:right; padding:10px 14px; font-size:.85rem; font-weight:600;}
.cc-menu-list button:hover{background:#f4f8f9;}
.progress-wrap{background:#eef3f5; border-radius:999px; height:9px; overflow:hidden;}
.progress-bar{height:100%; background:linear-gradient(90deg,var(--teal),var(--success)); border-radius:999px; transition:width .4s;}
.cc-nums{display:flex; justify-content:space-between; font-size:.78rem; color:#5b7382; font-weight:600;}
.cc-nums b{color:var(--navy);}
.cc-actions{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
.cc-actions button{
  background:var(--bg1); border:1px solid var(--line); border-radius:9px; padding:8px 4px;
  font-size:.72rem; font-weight:700; color:var(--navy); display:flex; flex-direction:column; align-items:center; gap:2px;
}
.cc-actions button:hover{background:#e4f1ee; border-color:var(--teal);}
.cc-actions button.primary{background:var(--teal); color:#fff; border-color:var(--teal);}
.cc-actions button.primary:hover{background:#0c5f58;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:10px;
  font-weight:700; font-size:.9rem; transition:transform .1s, box-shadow .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--teal); color:#fff; box-shadow:0 6px 16px -6px rgba(15,118,110,.5);}
.btn-primary:hover{background:#0c5f58;}
.btn-gold{background:var(--gold); color:var(--navy); box-shadow:0 6px 16px -6px rgba(234,179,8,.5);}
.btn-gold:hover{background:#c99a06;}
.btn-outline{background:#fff; color:var(--navy); border:1.5px solid var(--line);}
.btn-outline:hover{border-color:var(--teal); color:var(--teal);}
.btn-danger{background:var(--danger-bg); color:var(--danger); border:1.5px solid #fecaca;}
.btn-danger:hover{background:#fee2e2;}
.btn-sm{padding:7px 12px; font-size:.8rem;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

/* ---------- Login ---------- */
.login-wrap{min-height:calc(100vh - 76px); display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{
  background:#fff; border-radius:22px; box-shadow:var(--shadow); width:100%; max-width:400px;
  padding:36px 32px; text-align:center;
}
.login-card .brand-mark{margin:0 auto 14px; width:60px; height:60px; font-size:1.7rem;}
.login-card h2{color:var(--navy); font-size:1.3rem; font-weight:800; margin-bottom:4px;}
.login-card p.sub{color:#5b7382; font-size:.85rem; margin-bottom:26px;}
.field{text-align:right; margin-bottom:14px;}
.field label{display:block; font-size:.8rem; font-weight:700; color:var(--navy); margin-bottom:6px;}
.field input, .field select{
  width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg1);
  outline:none; transition:border .15s;
}
.field input:focus, .field select:focus{border-color:var(--teal); background:#fff;}
.login-tabs{display:flex; gap:8px; margin-bottom:20px; background:var(--bg1); padding:4px; border-radius:12px;}
.login-tabs button{flex:1; padding:9px; border-radius:9px; font-weight:700; font-size:.85rem; color:#5b7382;}
.login-tabs button.active{background:#fff; color:var(--navy); box-shadow:0 2px 8px rgba(0,0,0,.08);}
.login-error{color:var(--danger); font-size:.82rem; font-weight:600; margin-bottom:10px; min-height:1em;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(16,42,67,.55); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:16px; backdrop-filter:blur(2px);
}
.modal{
  background:#fff; border-radius:20px; width:100%; max-width:560px; max-height:90vh; overflow:auto;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
}
.modal.wide{max-width:820px;}
.modal-head{
  padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; background:#fff; z-index:2;
}
.modal-head h3{font-size:1.1rem; font-weight:800; color:var(--navy);}
.modal-close{font-size:1.3rem; color:#8299a6; padding:4px 10px; border-radius:8px;}
.modal-close:hover{background:#f2f5f6;}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:520px){.two-col{grid-template-columns:1fr;}}

/* ---------- Tables / lists ---------- */
.list-row{
  display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:10px;
  border:1px solid var(--line); margin-bottom:8px;
}
.list-row .info b{display:block; color:var(--navy); font-size:.92rem;}
.list-row .info span{color:#5b7382; font-size:.78rem;}
.row-actions{display:flex; gap:6px;}
.icon-btn{width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#5b7382; background:var(--bg1);}
.icon-btn:hover{background:#e4f1ee; color:var(--teal);}
.icon-btn.del:hover{background:var(--danger-bg); color:var(--danger);}
.searchbox{
  width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); margin-bottom:14px; background:var(--bg1);
}
.chip-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chip{
  padding:5px 10px; border-radius:999px; border:1.5px solid var(--line); font-size:.75rem; font-weight:700; color:#5b7382; cursor:pointer;
}
.chip.selected{background:var(--teal); color:#fff; border-color:var(--teal);}

/* ---------- Dropzone ---------- */
.dropzone{
  border:2px dashed var(--line); border-radius:14px; padding:26px; text-align:center; color:#5b7382; font-size:.85rem;
  transition:border-color .15s, background .15s; margin-top:14px; cursor:pointer;
}
.dropzone.drag{border-color:var(--teal); background:#f0faf8;}
.dropzone b{color:var(--teal); display:block; margin-bottom:4px; font-size:.95rem;}

/* ---------- Scan page ---------- */
.scan-wrap{max-width:640px; margin:0 auto; padding:26px 18px 60px;}
.scan-head{
  background:linear-gradient(135deg,var(--navy),#183f5f); color:#fff; border-radius:20px; padding:26px 24px; margin-bottom:20px;
  text-align:center; box-shadow:0 14px 30px -14px rgba(16,42,67,.5); position:relative; overflow:hidden;
}
.scan-head::after{
  content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% -10%, rgba(234,179,8,.25), transparent 60%);
}
.scan-head h2{font-size:1.3rem; font-weight:800; position:relative;}
.scan-head p{font-size:.85rem; color:#cfe0e8; margin-top:4px; position:relative;}
.scan-class-card{background:#fff;border:2px solid var(--gold);border-radius:18px;box-shadow:0 10px 28px -12px rgba(16,42,67,.25);padding:16px 18px;margin-bottom:16px;position:relative;overflow:hidden;}
.scan-class-card::before{content:'';position:absolute;right:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--gold),var(--teal));}
.scan-class-main{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.scan-class-title{font-size:1.15rem;font-weight:800;color:var(--navy);}
.scan-class-number{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:42px;padding:0 12px;border-radius:12px;background:var(--navy);color:var(--gold);font-size:1.15rem;font-weight:800;}
.scan-class-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.scan-class-meta span{background:var(--bg1);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.72rem;font-weight:700;color:#5b7382;}
.teacher-field{margin-top:16px; position:relative; z-index:5;}
.teacher-field input, .teacher-field select{
  width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid rgba(255,255,255,.35); background:#fff; text-align:center; font-weight:700; color:var(--navy); position:relative; z-index:6; cursor:text;
}
.teacher-field select{cursor:pointer; appearance:auto;}
.teacher-field input:focus, .teacher-field select:focus{outline:2px solid var(--gold); border-color:var(--gold);}
.student-item{
  display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:14px; padding:14px 16px;
  margin-bottom:10px; box-shadow:0 3px 10px -4px rgba(16,42,67,.12); border:2px solid transparent; transition:.15s;
}
.student-item.absent{border-color:var(--danger); background:var(--danger-bg);}
.student-item .s-info{display:flex; align-items:center; gap:12px;}
.student-item .s-num{
  width:34px; height:34px; border-radius:9px; background:var(--bg1); display:flex; align-items:center; justify-content:center;
  font-weight:800; color:var(--navy); font-size:.85rem;
}
.student-item.absent .s-num{background:var(--danger); color:#fff;}
.student-item .s-name{font-weight:700; color:var(--navy);}
.absent-toggle{
  width:56px; height:30px; border-radius:999px; background:#e2ecef; position:relative; transition:.2s; flex-shrink:0;
}
.absent-toggle::after{
  content:'حاضرة'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:.62rem; font-weight:800; color:#5b7382;
}
.absent-toggle.on{background:var(--danger);}
.absent-toggle.on::after{content:'غائبة'; color:#fff;}
.scan-submit-bar{position:sticky; bottom:14px; margin-top:18px;}
.scan-submit-bar button{width:100%; padding:15px; font-size:1rem; border-radius:14px; box-shadow:0 14px 26px -10px rgba(15,118,110,.55);}
.glow{box-shadow:0 0 0 6px rgba(234,179,8,.15), var(--shadow);}

/* confirm screen */
.confirm-wrap{text-align:center; background:#fff; border-radius:20px; padding:34px 26px; box-shadow:var(--shadow);}
.confirm-icon{
  width:74px; height:74px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;
  font-size:2rem; background:var(--success-bg); color:var(--success);
}
.confirm-wrap h2{font-size:1.25rem; font-weight:800; color:var(--navy); margin-bottom:6px;}
.confirm-nums{display:flex; justify-content:center; gap:14px; margin:18px 0;}
.confirm-nums .cn{padding:14px 20px; border-radius:14px; background:var(--bg1); min-width:100px;}
.confirm-nums .cn b{display:block; font-size:1.5rem; color:var(--navy);}
.confirm-nums .cn.absent b{color:var(--danger);}
.absent-names{text-align:right; background:var(--danger-bg); border-radius:12px; padding:14px 16px; margin-top:6px; max-height:200px; overflow:auto;}
.absent-names li{font-size:.85rem; padding:4px 0; color:#7a1f1f; font-weight:600; list-style:none;}

/* ---------- QR page ---------- */
.qr-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px;}
.qr-card{background:#fff; border-radius:18px; box-shadow:var(--shadow); padding:20px; text-align:center;}
.qr-card .qr-school{font-size:.72rem; color:#5b7382; font-weight:700;}
.qr-card .qr-class{font-size:1.05rem; font-weight:800; color:var(--navy); margin:4px 0 12px;}
.qr-card .qr-box{display:flex; justify-content:center; margin-bottom:12px;}
.qr-card .qr-hint{font-size:.72rem; color:var(--teal); font-weight:700; margin-bottom:12px;}
.qr-card .qr-actions{display:flex; gap:6px; justify-content:center;}

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff;
  padding:12px 22px; border-radius:12px; font-weight:700; font-size:.85rem; box-shadow:var(--shadow); opacity:0; transition:.25s; z-index:200;
  display:flex; align-items:center; gap:8px;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--danger);}

.empty{text-align:center; padding:50px 20px; color:#8299a6;}
.empty b{display:block; color:var(--navy); font-size:1rem; margin-bottom:6px;}


.report-dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
.report-kpi{background:#fff;border-radius:14px;padding:12px;box-shadow:0 5px 16px -8px rgba(16,42,67,.18);border-top:4px solid var(--teal);text-align:center}
.report-kpi:nth-child(2){border-top-color:var(--gold)} .report-kpi:nth-child(3){border-top-color:#2563eb} .report-kpi:nth-child(4){border-top-color:#dc2626}
.report-kpi .v{font-size:1.45rem;font-weight:800;color:#102a43}.report-kpi .l{font-size:.72rem;color:#334e68;font-weight:700}
.chart-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
.chart-card{background:#fff;border-radius:14px;box-shadow:0 5px 16px -8px rgba(16,42,67,.18);padding:14px 16px;break-inside:avoid}
.chart-card h3{font-size:.92rem;color:#102a43;margin-bottom:10px;font-weight:800}
.chart-row{display:grid;grid-template-columns:minmax(95px,1.1fr) 3fr 48px;align-items:center;gap:8px;margin:8px 0}
.chart-label{font-size:.73rem;font-weight:800;color:#102a43;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-track{height:12px;background:#eef3f5;border-radius:999px;overflow:hidden}
.chart-fill{height:100%;border-radius:999px;min-width:2px}.chart-fill.present{background:#16a34a}.chart-fill.absent{background:#dc2626}.chart-fill.gold{background:#eab308}
.chart-value{font-size:.73rem;font-weight:800;color:#102a43;text-align:center;background:#f4f8f9;border-radius:8px;padding:3px 5px}


@media print{
  .page-title button,.page-title + .card,.report-controls-card,.report-page-header{display:none !important;}
}
/* ---------- Class summary report ---------- */
.class-summary-card{background:#fff;border:1px solid #dbe6ec;border-radius:16px;padding:16px;box-shadow:0 6px 18px -10px rgba(16,42,67,.22);margin-top:14px;break-inside:avoid}
.class-summary-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}

function toEnDigits(s){ return String(s==null?'':s).replace(/[\u0660-\u0669]/g, d=>'\u0660\u0661\u0662\u0663\u0664\u0665\u0666\u0667\u0668\u0669'.indexOf(d)).replace(/[\u06F0-\u06F9]/g, d=>'\u06F0\u06F1\u06F2\u06F3\u06F4\u06F5\u06F6\u06F7\u06F8\u06F9'.indexOf(d)); }
function numStr(v){ return toEnDigits(v).trim(); }
function byNumber(a,b){ return numStr(a.number).localeCompare(numStr(b.number), 'ar', {numeric:true}); }
function sameCode(a,b){
  a = numStr(a); b = numStr(b);
  if(!a || !b) return false;
  if(a===b) return true;
  if(/^\d+$/.test(a) && /^\d+$/.test(b)) return a.replace(/^0+(?=\d)/,'')===b.replace(/^0+(?=\d)/,'');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

}

/* ==========================================================================
   المزامنة مع Google Sheets
   ========================================================================== */
let syncTimer = null;
async function pushToServer(action, payload){
  if(!SCRIPT_URL) return { ok:false, offline:true };
  try{
    const res = await fetch(SCRIPT_URL, {
      method:'POST',
      cache:'no-store',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action, payload })
    });
    const result = await res.json();
    // فور نجاح الإرسال، نسحب أحدث نسخة من الخادم مباشرة حتى تنعكس التغييرات فوراً
    // على أي جهاز آخر (لوحة التحكم) دون انتظار دورة المزامنة التالية.
    if(result && result.ok) pullFromServer(true);
    return result;
  }catch(e){ return { ok:false, error:String(e) }; }
}
async function pullFromServer(silent){
  if(!SCRIPT_URL) return;
  try{
    // نضيف طابع زمني ونمنع التخزين المؤقت (cache) حتى لا تُعرض بيانات قديمة
    // من ذاكرة التخزين المؤقت للمتصفح بدلاً من آخر تحديث فعلي من الخادم.
    const res = await fetch(SCRIPT_URL + '?action=bootstrap&_=' + Date.now(), { cache:'no-store' });
    const data = await res.json();
    if(data.ok){
      const sigBefore = scanSig();
      const nextClasses = (data.classes||[]).map(c=>({id:String(c.id).trim(), number:c.number, name:c.name}));
      const nextStudents = (data.students||[]).map(s=>({id:String(s.id).trim(), classId:String(s.classId||'').trim(), number:numStr(s.number), name:s.name}));
      const nextStaff = (data.staff||[]).map(s=>({id:s.id, name:s.name, role:s.role, username:s.username, password:s.password, classes: typeof s.classes==='string' ? s.classes.split(',').filter(Boolean) : (s.classes||[])}));
      // أسماء المعلمين السريعة (اختيارية) — إن كان الخادم لا يدعمها بعد، نُبقي القائمة المحلية كما هي.
      const nextTeacherNames = Array.isArray(data.teacherNames) ? data.teacherNames.filter(Boolean) : store.teacherNames;
      const map = {};
      (data.attendance||[]).forEach(r=>{
        const key = r.classId+'|'+r.date;
        if(!map[key]) map[key] = { id:key, classId:r.classId, date:r.date, teacher:r.teacher, time:r.time, records:[] };
        map[key].records.push({ studentId:r.studentId, studentName:r.studentName, status:r.status });
      });
      const nextAttendance = Object.values(map);
      // رصد محفوظ محلياً ولم يصل للخادم بعد: نُبقيه ولا نتركه يُمسح عند المزامنة
      (store.attendance||[]).filter(a=>a.pending).forEach(p=>{
        const i = nextAttendance.findIndex(a=>a.id===p.id);
        if(i>=0) nextAttendance[i] = p; else nextAttendance.push(p);
      });

      const changed = JSON.stringify({c:store.classes, s:store.students, st:store.staff, a:store.attendance, tn:store.teacherNames})
        !== JSON.stringify({c:nextClasses, s:nextStudents, st:nextStaff, a:nextAttendance, tn:nextTeacherNames});

      store.classes = nextClasses;
      store.students = nextStudents;
      store.staff = nextStaff;
      store.attendance = nextAttendance;
      store.teacherNames = nextTeacherNames;
      saveStore();

      const modalOpen = document.getElementById('modalHost') && document.getElementById('modalHost').innerHTML.trim()!=='';
      const onScan = route.name==='scan' || route.name==='scanDeep';
      if(!silent) render();
      else if(onScan && !modalOpen && sigBefore !== scanSig()) refreshScanKeepState();
      else if(route.name==='dashboard' && changed && !modalOpen) render();
      return true;
    }
  }catch(e){ /* stay offline-silent */ }
  return false;
}
function scanSig(){
  if(!route || !route.classId) return '';
  const cls = store.classes.find(c=>c.id===route.classId);
  return JSON.stringify({ c: cls ? cls.name : null, s: studentsOfClass(route.classId).map(s=>[s.id, s.number, s.name]), a: attendanceOf(route.classId) || null });
}
function refreshScanKeepState(){
  const keep = new Set(scanAbsentSet);
  const t = document.getElementById('teacherSelect');
  const teacherVal = t ? t.value : null;
  render();
  keep.forEach(id=> toggleStudentAbsent(id));
  const t2 = document.getElementById('teacherSelect');
  if(t2 && teacherVal!==null && teacherVal!=='') t2.value = teacherVal;
}
let retryingPending = false, pendingTimer = null;
async function retryPendingAttendance(){
  if(retryingPending) return;
  const list = (store.attendance||[]).filter(a=>a.pending);
  if(!list.length) return;
  retryingPending = true;
  try{
    for(const s of list){
      const r = await pushToServer('saveAttendance', s);
      if(r && r.ok){ delete s.pending; saveStore(); }
    }
  } finally { retryingPending = false; }
}
function schedulePendingRetry(){
  if(pendingTimer) return;
  pendingTimer = setInterval(async ()=>{
    await retryPendingAttendance();
    if(!(store.attendance||[]).some(a=>a.pending)){ clearInterval(pendingTimer); pendingTimer = null; render(); }
  }, 6000);
}
let syncListenersBound = false;
function startAutoSync(){
  if(syncTimer) clearInterval(syncTimer);
  if(!SCRIPT_URL) return;
  pullFromServer(true);
  syncTimer = setInterval(()=>pullFromServer(true), 4000);
  if(!syncListenersBound){
    syncListenersBound = true;
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pullFromServer(true); });
    window.addEventListener('focus', ()=> pullFromServer(true));
  }
}

/* ==========================================================================

   ========================================================================== */
function studentsOfClass(classId){ return store.students.filter(s=>s.classId===classId); }
function attendanceOf(classId, date){ return store.attendance.find(a=>a.classId===classId && a.date===(date||todayStr())); }
function classStats(cls){
  const total = studentsOfClass(cls.id).length;
  const att = attendanceOf(cls.id);
  const marked = att ? att.records.length : 0;
  const absent = att ? att.records.filter(r=>r.status==='غائب').length : 0;
  const present = marked - absent;
  const pct = total ? Math.round((present/total)*100) : 0;
  return { total, marked, absent, present, pct };
}
function visibleClasses(){
  if(!session) return [];
  if(session.type==='admin') return store.classes;
  return store.classes.filter(c=> (session.classes||[]).includes(c.id));
}
function notificationData(){
  const items=[];
  const today=todayStr();
  (store.attendance||[]).filter(a=>a.date===today).forEach(a=>{
    const cls=store.classes.find(c=>c.id===a.classId);
    const absent=(a.records||[]).filter(r=>r.status==='غائب').length;
    if(absent) items.push({kind:'absent',text:`فصل ${cls?cls.name:'غير معروف'}: ${absent} غائبة اليوم`});
    if(a.pending) items.push({kind:'pending',text:`رصد فصل ${cls?cls.name:'غير معروف'} بانتظار المزامنة`});
  });
  return items;
}
function notificationBellHtml(){
  const items=notificationData();
  const count=items.length;
  return `<div class="notify-wrap" id="notifyWrap">
    <button class="notify-btn" id="notifyBtn" title="التنبيهات" aria-label="التنبيهات">🔔${count?`<span class="notify-badge">${count>99?'99+':count}</span>`:''}</button>
    <div class="notify-panel" id="notifyPanel">
      <div class="notify-head"><span>التنبيهات</span><span style="font-size:.72rem;color:#8299a6;">اليوم ${todayDateHtml()}</span></div>
      ${items.length?items.map(x=>`<div class="notify-item">🔔 <b>${esc(x.text)}</b></div>`).join(''):'<div class="notify-empty">لا توجد تنبيهات حالياً</div>'}
    </div>
  </div>`;
}

/* ==========================================================================
   العرض الرئيسي
   ========================================================================== */
function render(){
  try{ renderInner(); }
  catch(err){
    console.error(err);
    const app = document.getElementById('app');
    if(app) app.innerHTML = `<div class="empty"><b>تعذّر عرض الصفحة</b>${esc(err.message)}</div>`;
  }
}
function renderInner(){
  const active = document.activeElement;
  let focusInfo = null;
  if(active && active.id && (active.tagName==='INPUT' || active.tagName==='TEXTAREA')){
    focusInfo = { id: active.id, selStart: active.selectionStart, selEnd: active.selectionEnd };
  }
  renderTopnav();
  const app = document.getElementById('app');
  if(route.name==='scanDeep'){ app.innerHTML = viewScan(route.classId); bindScan(); }
  else if(!session){ app.innerHTML = viewLogin(); bindLogin(); }
  else{
    switch(route.name){
      case 'dashboard': app.innerHTML = viewDashboard(); bindDashboard(); break;
      case 'scan': app.innerHTML = viewScan(route.classId); bindScan(); break;
      case 'qr': app.innerHTML = viewQR(); bindQR(); break;
      case 'reports': app.innerHTML = viewReports(); bindReports(); break;
      case 'manage': app.innerHTML = viewManage(); bindManage(); break;
      case 'staff': app.innerHTML = viewStaff(); bindStaff(); break;
      default: app.innerHTML = viewDashboard(); bindDashboard();
    }
  }
  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
      el.focus();
      try{ el.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); }catch(e){}
    }
  }
}
function renderTopnav(){
  const nav = document.getElementById('topnav');
  if(!session){ nav.innerHTML=''; return; }
  let links = `<a class="nav-btn ${route.name==='dashboard'?'active':''}" data-nav="dashboard">لوحة التحكم</a>`;
  links += `<a class="nav-btn ${route.name==='qr'?'active':''}" data-nav="qr">أكواد QR</a>`;
  links += `<a class="nav-btn ${route.name==='reports'?'active':''}" data-nav="reports">التقارير</a>`;
  if(session.type==='admin'){
    links += `<a class="nav-btn ${route.name==='manage'?'active':''}" data-nav="manage">إدارة الفصول والطلاب</a>`;
    links += `<a class="nav-btn ${route.name==='staff'?'active':''}" data-nav="staff">الإداريات</a>`;
  }
  nav.innerHTML = `
    ${links}
    ${notificationBellHtml()}
    <div class="user-chip"><span class="dot"></span> ${esc(session.name)}</div>
    <button class="nav-btn logout-btn" id="logoutBtn">خروج</button>
  `;
  nav.querySelectorAll('[data-nav]').forEach(el=> el.onclick = ()=> navigate(el.dataset.nav));
  document.getElementById('logoutBtn').onclick = logout;
  const notifyBtn=document.getElementById('notifyBtn');
  const notifyPanel=document.getElementById('notifyPanel');
  if(notifyBtn && notifyPanel){
    notifyBtn.onclick=(e)=>{e.stopPropagation();notifyPanel.classList.toggle('open');};
    document.addEventListener('click',()=>notifyPanel.classList.remove('open'),{once:true});
  }
}

async function deleteClass(classId){
  const cls = store.classes.find(c=>c.id===classId);
  const count = studentsOfClass(classId).length;
  const msg = count>0
    ? `سيتم حذف فصل "${cls?cls.name:''}" مع جميع طالباته (${count}) وسجلات غيابه نهائياً. متابعة؟`
    : 'تأكيد حذف الفصل؟';
  if(!confirm(msg)) return;
  const pass = prompt('لتأكيد الحذف، يرجى إدخال كلمة مرور المشرفة:');
  if(pass===null) return; // ألغت العملية
  if(pass !== ADMIN_PASS){ toast('كلمة المرور غير صحيحة — لم يتم حذف الفصل', true); return; }
  store.classes = store.classes.filter(c=>c.id!==classId);
  store.students = store.students.filter(s=>s.classId!==classId);
  store.attendance = store.attendance.filter(a=>a.classId!==classId);
  saveStore(); render();
  await pushToServer('deleteClass', {id:classId});
  toast('تم حذف الفصل وجميع طالباته');
}
async function deleteTodayAttendance(classId){

  await pushToServer('deleteToday', {classId, date:todayStr()});
  toast('تم حذف رصد اليوم');
}

      </div>
    </div>
  </div>`;
  let tempStudents = [];
  const close = ()=> host.innerHTML='';
  document.getElementById('cl').onclick = close;
  document.getElementById('cancel').onclick = close;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') close(); };

  if(existing){
    const drawEditStudents = (filter)=>{
      let list = studentsOfClass(existing.id).sort(byNumber);
      if(filter) list = list.filter(s=> s.name.includes(filter) || String(s.number).includes(filter));
      document.getElementById('editStudentCount').textContent = studentsOfClass(existing.id).length;
      document.getElementById('editStudentsList').innerHTML = list.map(s=>`
        <div class="list-row">
          <div class="info"><b>${esc(s.name)}</b><span>رقم ${esc(s.number)}</span></div>
          <div class="row-actions">
            <button class="icon-btn" data-move-student-inline="${s.id}" title="نقل إلى فصل آخر">↔</button>
            <button class="icon-btn" data-edit-student-inline="${s.id}" title="تعديل">✎</button>
            <button class="icon-btn del" data-del-student-inline="${s.id}" title="حذف">🗑</button>
          </div>
        </div>`).join('') || `<div class="empty"><b>لا توجد طالبات مطابقة</b></div>`;
      document.querySelectorAll('[data-edit-student-inline]').forEach(b=> b.onclick = ()=> openStudentFormModal(existing.id, store.students.find(s=>s.id===b.dataset.editStudentInline), ()=> drawEditStudents(document.getElementById('editSearchS').value.trim())));
      document.querySelectorAll('[data-del-student-inline]').forEach(b=> b.onclick = async ()=>{
        if(!confirm('حذف هذه الطالب؟')) return;
        store.students = store.students.filter(s=>s.id!==b.dataset.delStudentInline); saveStore();
        await pushToServer('deleteStudent', {id:b.dataset.delStudentInline});
        drawEditStudents(document.getElementById('editSearchS').value.trim());
        toast('تم حذف الطالب');
      });
    };
    drawEditStudents();
    document.getElementById('editSearchS').oninput = (e)=> drawEditStudents(e.target.value.trim());
    document.getElementById('editAddS').onclick = ()=> openStudentFormModal(existing.id, null, ()=> drawEditStudents(document.getElementById('editSearchS').value.trim()));

    const addImportedToExistingClass = async (names)=>{
      const clean = names.map(n=>String(n||'').trim()).filter(Boolean);
      const existingNames = new Set(store.students.map(s=>s.name.trim()));
      const unique = clean.filter(n=>!existingNames.has(n));
      if(!unique.length){ toast('لا توجد أسماء جديدة لإضافتها', true); return; }
      const current = studentsOfClass(existing.id);
      const start = current.length + 1;
      for(let i=0;i<unique.length;i++){
        const st = {id:uid(), classId:existing.id, number:String(start+i), name:unique[i]};
        store.students.push(st);
        await pushToServer('saveStudent', st);
      }
      saveStore();
      drawEditStudents(document.getElementById('editSearchS').value.trim());
      renderTopnav();
      toast(`تمت إضافة ${unique.length} طالبة للفصل`);
    };

    const editDz = document.getElementById('editDz');
    const editFileInput = document.getElementById('editFileInput');
    const editDzStatus = document.getElementById('editDzStatus');
    const readImportedFile = async (file)=>{
      const ext=(file.name.split('.').pop()||'').toLowerCase();
      editDzStatus.textContent='جاري قراءة الملف...';
      try{
        let names=[];
        if(ext==='xlsx'||ext==='xls'){
          const bin=await file.arrayBuffer();
          const wb=XLSX.read(bin,{type:'array'});
          const ws=wb.Sheets[wb.SheetNames[0]];
          const rows=XLSX.utils.sheet_to_json(ws,{header:1});
          names=rows.filter(r=>r.length&&r[0]!=='').map(r=>String(r.length>=2?r[1]:r[0]).trim()).filter(Boolean);
        }else if(ext==='pdf'){
          if(!window.pdfjsLib) throw new Error('pdfjs missing');
          const buf=await file.arrayBuffer(), pdf=await pdfjsLib.getDocument({data:buf}).promise, lines=[];
          for(let pg=1;pg<=pdf.numPages;pg++){
            const page=await pdf.getPage(pg), content=await page.getTextContent();
            let line='', lastY=null;
            content.items.forEach(item=>{
              const y=item.transform[5];
              if(lastY!==null&&Math.abs(y-lastY)>2){ if(line.trim()) lines.push(line); line=''; }
              line+=item.str; lastY=y;
            });
            if(line.trim()) lines.push(line);
          }
          names=cleanNameLines(lines);
        }else if(ext==='docx'){
          if(!window.mammoth) throw new Error('mammoth missing');
          const res=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
          names=cleanNameLines(res.value.split(/\r?\n/));
        }else if(ext==='doc'){
          toast('صيغة .doc غير مدعومة — استخدمي .docx أو PDF',true); return;
        }else{
          names=cleanNameLines((await file.text()).split(/\r?\n/));
        }
        await addImportedToExistingClass(names);
      }catch(err){ toast('تعذّرت قراءة الملف — تأكدي من صيغته',true); }
      finally{ editDzStatus.textContent=''; if(editFileInput) editFileInput.value=''; }
    };
    editDz.onclick=()=>editFileInput.click();
    editFileInput.onchange=e=>{if(e.target.files[0]) readImportedFile(e.target.files[0]);};
    editDz.addEventListener('dragover',e=>{e.preventDefault(); editDz.classList.add('drag');});
    editDz.addEventListener('dragleave',()=>editDz.classList.remove('drag'));
    editDz.addEventListener('drop',e=>{e.preventDefault();editDz.classList.remove('drag');if(e.dataTransfer.files[0])readImportedFile(e.dataTransfer.files[0]);});
    editDz.addEventListener('paste',e=>{
      const text=(e.clipboardData||window.clipboardData).getData('text');
      if(text&&text.trim()){e.preventDefault();addImportedToExistingClass(cleanNameLines(text.split(/\r?\n/)));}
    });
    document.getElementById('editBtnParseText').onclick=()=>{
      const text=document.getElementById('editBulkStudentsText').value;
      document.getElementById('editBulkStudentsText').value='';
      addImportedToExistingClass(cleanNameLines(text.split(/\r?\n/)));
    };

    document.querySelectorAll('[data-move-student-inline]').forEach(b=> b.onclick = ()=>{
      openStudentFormModal(existing.id, store.students.find(s=>s.id===b.dataset.moveStudentInline), ()=> drawEditStudents(document.getElementById('editSearchS').value.trim()));
    });
  }

  if(!existing){
    const renderTemp = ()=>{
      document.getElementById('studentCount').textContent = tempStudents.length;
      document.getElementById('tempStudentList').innerHTML = tempStudents.map((name,i)=>`
        <div class="list-row" style="margin-bottom:6px; padding:9px 12px;">
          <div class="info"><b style="font-size:.88rem;">${esc(name)}</b></div>
          <button class="icon-btn del" data-rm="${i}">🗑</button>
        </div>`).join('') || `<p style="color:#8299a6; font-size:.85rem;">لم تتم إضافة أي طالبة بعد</p>`;
      document.querySelectorAll('[data-rm]').forEach(b=> b.onclick = ()=>{ tempStudents.splice(Number(b.dataset.rm),1); renderTemp(); });
    };
    const addNames = (names)=>{
      names.forEach(n=>{ if(n && !tempStudents.includes(n)) tempStudents.push(n); });
      renderTemp();
    };
    renderTemp();

    document.getElementById('btnAddSingle').onclick = ()=>{
      const inp = document.getElementById('singleStudentName');
      const val = inp.value.trim();
      if(val){ addNames([val]); inp.value=''; inp.focus(); }
    };
    document.getElementById('singleStudentName').addEventListener('keypress', e=>{
      if(e.key==='Enter'){ e.preventDefault(); document.getElementById('btnAddSingle').click(); }
    });
    document.getElementById('btnParseText').onclick = ()=>{
      const text = document.getElementById('bulkStudentsText').value;
      addNames(cleanNameLines(text.split(/\r?\n/)));
      document.getElementById('bulkStudentsText').value='';
    };

    const dz = document.getElementById('dz');
    dz.onclick = ()=> document.getElementById('fileInput').click();
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', ()=> dz.classList.remove('drag'));
    dz.addEventListener('drop', e=>{
      e.preventDefault(); dz.classList.remove('drag');
      if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    document.getElementById('fileInput').onchange = (e)=>{ if(e.target.files[0]) handleFile(e.target.files[0]); };

    // لصق مباشر (Ctrl+V) داخل مربع السحب والإفلات نفسه
    dz.addEventListener('paste', (e)=>{
      const text = (e.clipboardData || window.clipboardData).getData('text');
      if(text && text.trim()){
        e.preventDefault();
        addNames(cleanNameLines(text.split(/\r?\n/)));
        toast('تم لصق الأسماء');
      }
    });

    // ينظّف أسطر الأسماء المستخرجة: يحذف الأسطر الفارغة، أرقام الترقيم التلقائي
    // في بداية السطر (1. أو 1- أو 1)), وأسطر الأرقام المفردة (مثل أرقام الصفحات)
    function cleanNameLines(lines){
      return lines
        .map(l=> l.replace(/\u200f|\u200e/g,'').trim())
        .map(l=> l.replace(/^[\d٠-٩]+[\.\-\)]\s*/, '').trim())
        .filter(l=> l && !/^[\d٠-٩\s]+$/.test(l));
    }

    const dzStatus = document.getElementById('dzStatus');

    async function handleFile(file){
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      dzStatus.textContent = 'جاري قراءة الملف...';
      try{
        let names = [];
        if(ext === 'xlsx' || ext === 'xls'){
          const bin = await file.arrayBuffer();
          const wb = XLSX.read(bin, {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1});
          names = rows.filter(r=>r.length && r[0]!=='').map(r=> String(r.length>=2? r[1] : r[0]).trim()).filter(Boolean);
        }else if(ext === 'pdf'){
          if(!window.pdfjsLib) throw new Error('pdfjs missing');
          const buf = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({data: buf}).promise;
          const lines = [];
          for(let p=1; p<=pdf.numPages; p++){
            const page = await pdf.getPage(p);
            const content = await page.getTextContent();
            let currentLine = '', lastY = null;
            content.items.forEach(item=>{
              const y = item.transform[5];
              if(lastY !== null && Math.abs(y - lastY) > 2){
                if(currentLine.trim()) lines.push(currentLine);
                currentLine = '';
              }
              currentLine += item.str;
              lastY = y;
            });
            if(currentLine.trim()) lines.push(currentLine);
          }
          names = cleanNameLines(lines);
        }else if(ext === 'docx'){
          if(!window.mammoth) throw new Error('mammoth missing');
          const buf = await file.arrayBuffer();
          const res = await mammoth.extractRawText({arrayBuffer: buf});
          names = cleanNameLines(res.value.split(/\r?\n/));
        }else if(ext === 'doc'){
          toast('صيغة Word القديمة (.doc) غير مدعومة — الرجاء حفظ الملف بصيغة .docx أو .pdf ثم إعادة المحاولة', true);
          dzStatus.textContent = '';
          return;
        }else{
          const text = await file.text();
          names = cleanNameLines(text.split(/\r?\n/));
        }
        if(!names.length){ toast('لم يتم العثور على أسماء في هذا الملف', true); dzStatus.textContent=''; return; }
        addNames(names);
        dzStatus.textContent = '';
        toast(`تم استيراد ${names.length} اسم من "${file.name}"`);
      }catch(err){
        dzStatus.textContent = '';
        toast('تعذّرت قراءة الملف — تأكدي أنه غير محمي بكلمة مرور وبصيغة صحيحة', true);
      }
    }
  }

  document.getElementById('save').onclick = async ()=>{
    const number = document.getElementById('cNum').value.trim();
    const name = document.getElementById('cName').value.trim();
    if(!name){ toast('يرجى إدخال اسم الفصل', true); return; }
    if(existing){
      existing.number = number; existing.name = name;
      saveStore(); await pushToServer('saveClass', existing);
      toast('تم تحديث الفصل');
    }else{
      const classId = uid();
      const classObj = { id: classId, number: number || name, name };
      const newStudents = tempStudents.map((n,i)=>({ id: uid(), classId, number: String(i+1), name: n }));
      store.classes.push(classObj);
      store.students.push(...newStudents);
      saveStore();
      await pushToServer('saveClassWithStudents', { classObj, students: newStudents });
      toast('تم حفظ الفصل والطلاب بنجاح');
    }
    close(); render();
  };
}

    document.querySelectorAll('[data-move-student]').forEach(b=> b.onclick = ()=> openStudentFormModal(classId, store.students.find(s=>s.id===b.dataset.moveStudent), ()=>{ document.getElementById('studentsList').innerHTML = draw(); bindStudentRowEvents(); }));
    document.querySelectorAll('[data-edit-student]').forEach(b=> b.onclick = ()=> openStudentFormModal(classId, store.students.find(s=>s.id===b.dataset.editStudent), ()=>{ document.getElementById('studentsList').innerHTML = draw(); bindStudentRowEvents(); }));

      if(!confirm('حذف هذه الطالب؟')) return;

      await pushToServer('deleteStudent', {id:b.dataset.delStudent});

      renderTopnav();
    });
  }
  bindStudentRowEvents();
}

  wrap.querySelector('#ov2').onclick = (e)=>{ if(e.target.id==='ov2') close(); };
  wrap.querySelector('#save2').onclick = async ()=>{
    const name = wrap.querySelector('#sName').value.trim();
    const number = wrap.querySelector('#sNum').value.trim();
    const clsId = wrap.querySelector('#sClass').value;
    if(!name){ toast('أدخلي اسم الطالب', true); return; }
    if(existing){
      existing.name=name; existing.number=number; existing.classId=clsId;
      saveStore(); await pushToServer('saveStudent', existing);
      toast('تم تحديث بيانات الطالب');
    }else{

      store.students.push(st); saveStore();
      await pushToServer('saveStudent', st);
      toast('تمت إضافة الطالب');
    }
    close(); onDone && onDone(); renderTopnav();
  };

let scanAbsentSet = new Set();
function toggleStudentAbsent(id){
  const btn = document.querySelector(`[data-toggle="${id}"]`);
  if(!btn) return false;
  const item = btn.closest('.student-item');
  if(scanAbsentSet.has(id)){ scanAbsentSet.delete(id); btn.classList.remove('on'); item.classList.remove('absent'); }
  else{ scanAbsentSet.add(id); btn.classList.add('on'); item.classList.add('absent'); }
  return true;
}
function bindScan(){
  scanAbsentSet = new Set();
  const list = document.getElementById('studentsList');
  if(!list) { bindEditBtn(); return; }
  list.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-toggle]');
    if(!btn) return;
    toggleStudentAbsent(btn.dataset.toggle);
  });
  const searchInput=document.getElementById('studentSearchInput');
  if(searchInput){
    searchInput.addEventListener('input',()=>{
      const q=searchInput.value.trim().toLowerCase();
      document.querySelectorAll('#studentsList .student-item').forEach(item=>{
        const name=(item.dataset.studentName||'').toLowerCase();
        item.style.display=!q||name.includes(q)?'':'none';
      });
    });
  }
  const finishBtn = document.getElementById('finishScan');
  if(finishBtn) finishBtn.onclick = submitScan;
  const teacherInput = document.getElementById('teacherSelect');
  const teacherList = document.getElementById('teacherSelectList');
  if(teacherList && teacherInput){ teacherList.onchange=()=>teacherInput.value=teacherList.value; teacherInput.oninput=()=>{if(teacherList.value!==teacherInput.value) teacherList.value='';}; }
  const addNameBtn = document.getElementById('addTeacherNameBtn');
  if(addNameBtn) addNameBtn.onclick = addTeacherNameQuick;
  bindEditBtn();
}
async function addTeacherNameQuick(){
  const name = (prompt('اكتبي اسم المعلم لإضافته إلى القائمة:')||'').trim();
  if(!name) return;
  if(!store.teacherNames) store.teacherNames = [];
  if(!store.teacherNames.includes(name)){
    store.teacherNames.push(name);
    saveStore();
    await pushToServer('saveTeacherName', {name});
  }
  // نحدّث القائمة المنسدلة وحقل الإدخال مباشرة دون إعادة رسم الصفحة
  // حتى لا تُفقد حالة الطلاب المحددات كغائبات أثناء الرصد.
  const list = document.getElementById('teacherSelectList');
  if(list && !Array.from(list.options).some(o=>o.value===name)){
    const opt = document.createElement('option'); opt.value = name; list.appendChild(opt);
  }
  const input = document.getElementById('teacherSelect');
  if(input) input.value = name;
  if(list) list.value = name;
  toast(`تمت إضافة "${name}" إلى قائمة المعلمين`);
}
function bindEditBtn(){
  const editBtn = document.getElementById('editScanBtn');
  if(editBtn) editBtn.onclick = ()=>{ route.editing = true; render(); };
}
async function submitScan(){
  const classId = route.classId;
  const teacherSel = document.getElementById('teacherSelect');
  const teacher = (teacherSel ? teacherSel.value.trim() : '') || 'غير محدد';
  const students = studentsOfClass(classId);
  const records = students.map(s=>({ studentId:s.id, studentName:s.name, status: scanAbsentSet.has(s.id)?'غائب':'حاضر' }));
  const session_ = { id: classId+'|'+todayStr(), classId, date: todayStr(), teacher, time: nowTimeStr(), records, pending:true };
  store.attendance = store.attendance.filter(a=>!(a.classId===classId && a.date===todayStr()));
  store.attendance.push(session_);
  saveStore();
  const res = await pushToServer('saveAttendance', session_);
  if(res && res.ok){ delete session_.pending; saveStore(); }
  else{ toast('تعذّر الحفظ على الخادم — ستتم إعادة المحاولة تلقائياً', true); schedulePendingRetry(); }
  speakThanks(teacher, records.filter(r=>r.status==='غائب').length);
  route.editing = false;
  render();
}
function speakThanks(teacher, absentCount){
  try{
    const greeting = (teacher && teacher!=='غير محدد') ? `شكراً لك ${teacher}، ` : 'شكراً لك، ';
    const msg = absentCount>0
      ? `${greeting}تم رصد الغياب بنجاح. عدد الغائبات ${absentCount}.`
      : `${greeting}تم رصد الحضور. جميع الطلاب حاضرات.`;
    const utter = new SpeechSynthesisUtterance(msg);
    utter.lang = 'ar-SA';
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }catch(e){}
}

function classScanUrl(classId){
  const url = new URL(window.location.href);
  url.search = '?class=' + encodeURIComponent(classId);
  url.hash = '';
  return url.toString();
}
function bindQR(){
  visibleClasses().forEach(c=>{
    const box = document.getElementById('qrbox-'+c.id);
    if(box && window.QRCode) new QRCode(box, { text: classScanUrl(c.id), width:150, height:150, colorDark:'#102a43', colorLight:'#ffffff' });
  });
  document.querySelectorAll('[data-copy]').forEach(b=> b.onclick = ()=>{
    navigator.clipboard.writeText(classScanUrl(b.dataset.copy)).then(()=> toast('تم نسخ الرابط')).catch(()=> toast('تعذّر النسخ', true));
  });
  document.querySelectorAll('[data-print]').forEach(b=> b.onclick = ()=> printQRClasses([b.dataset.print]));
  document.getElementById('printAll').onclick = ()=> printQRClasses(visibleClasses().map(c=>c.id));
}
function printQRClasses(classIds){
  const classes=(visibleClasses()||[]).filter(c=>classIds.includes(c.id));
  if(!classes.length){ toast('لا توجد فصول للطباعة', true); return; }
  const w=window.open('', '_blank');
  if(!w){ toast('يرجى السماح بالنوافذ المنبثقة للطباعة', true); return; }

  const cards=classes.map(c=>`
    <div class="qr-card">
      <div class="qr-school">${esc(SCHOOL_NAME)}</div>
      <div class="qr-class">${esc(c.name)}</div>
      <div class="qr-box" id="print-qr-${esc(c.id)}"></div>
      <div class="qr-hint">امسحي الكود لبدء رصد الغياب</div>
    </div>`).join('');

  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8"><title>أكواد QR للفصول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
    <style>
      body{font-family:'Cairo',sans-serif;padding:20px;direction:rtl;background:#fff}
      .qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
      .qr-card{border:2px solid #102a43;border-radius:14px;padding:18px;text-align:center;page-break-inside:avoid;break-inside:avoid;background:#fff}
      .qr-school{font-size:11px;color:#555}.qr-class{font-size:18px;font-weight:800;color:#102a43;margin:6px 0 12px}
      .qr-box{display:flex;justify-content:center;align-items:center;min-height:150px;margin-bottom:10px}
      .qr-box canvas,.qr-box img{display:block;width:150px;height:150px;margin:0 auto}
      .qr-hint{font-size:11px;color:#0f766e;font-weight:700}
      @media print{.qr-card{page-break-inside:avoid;break-inside:avoid}.qr-box canvas,.qr-box img{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
    </style>
  </head><body><div class="qr-grid">${cards}</div></body></html>`);
  w.document.close();

  const build=()=>{
    try{
      classes.forEach(c=>{
        const box=w.document.getElementById('print-qr-'+c.id);
        if(box && w.QRCode){
          box.innerHTML='';
          new w.QRCode(box,{text:classScanUrl(c.id),width:150,height:150,colorDark:'#102a43',colorLight:'#ffffff',correctLevel:w.QRCode.CorrectLevel.M});
        }
      });
      setTimeout(()=>{w.focus();w.print();},900);
    }catch(e){ try{w.close();}catch(_){} toast('تعذّر تجهيز الباركود للطباعة', true); }
  };
  if(w.QRCode) build(); else setTimeout(build,1000);
}

function openStaffModal(existing){

          </div>

    </div>
  </div>`;
  const close = ()=> host.innerHTML='';
  document.getElementById('cl').onclick = close;

  });
  document.getElementById('save').onclick = async ()=>{

    close(); render();
  };
}

function bindManage(){
  const addClass=document.getElementById('manageAddClass'); if(addClass) addClass.onclick=()=>openClassModal();
  document.querySelectorAll('[data-manage-select]').forEach(b=>b.onclick=()=>{route.manageClassId=b.dataset.manageSelect;render();});
  document.querySelectorAll('[data-manage-edit]').forEach(b=>b.onclick=()=>openClassModal(store.classes.find(c=>c.id===b.dataset.manageEdit)));
  document.querySelectorAll('[data-manage-delete]').forEach(b=>b.onclick=()=>deleteClass(b.dataset.manageDelete));
  const search=document.getElementById('manageStudentSearch');
  if(search) search.oninput=()=>document.querySelectorAll('.manage-student-row').forEach(r=>r.style.display=(r.textContent.toLowerCase().includes(search.value.trim().toLowerCase())?'':'none'));
  document.querySelectorAll('[data-manage-student-move]').forEach(b=>b.onclick=()=>openStudentFormModal(route.manageClassId,store.students.find(s=>s.id===b.dataset.manageStudentMove),()=>render()));
  document.querySelectorAll('[data-manage-student-edit]').forEach(b=>b.onclick=()=>openStudentFormModal(route.manageClassId,store.students.find(s=>s.id===b.dataset.manageStudentEdit),()=>render()));
  document.querySelectorAll('[data-manage-student-delete]').forEach(b=>b.onclick=async()=>{
    if(!confirm('حذف هذه الطالب؟'))return;
    const id=b.dataset.manageStudentDelete; store.students=store.students.filter(s=>s.id!==id); saveStore(); await pushToServer('deleteStudent',{id}); render(); toast('تم حذف الطالب');
  });
  document.getElementById('manageSelectAll')?.addEventListener('click',()=>document.querySelectorAll('.manage-student-check').forEach(x=>x.checked=true));
  document.getElementById('manageDeleteSelected')?.addEventListener('click',async()=>{
    const ids=[...document.querySelectorAll('.manage-student-check:checked')].map(x=>x.value);
    if(!ids.length){toast('حددي الطلاب أولاً',true);return}
    if(!confirm(`حذف ${ids.length} طالبة؟`))return;
    store.students=store.students.filter(s=>!ids.includes(s.id)); saveStore();
    for(const id of ids) await pushToServer('deleteStudent',{id});
    render(); toast('تم حذف الطلاب المحددة');
  });
  document.getElementById('manageAddStudent')?.addEventListener('click',()=>openStudentFormModal(route.manageClassId,null,()=>render()));
  const addNames=async(names)=>{
    const clean=cleanNameLines(names.flatMap(x=>String(x||'').split(/\r?\n/))).filter(Boolean);
    const cls=store.classes.find(c=>c.id===route.manageClassId); if(!cls||!clean.length){toast('لم يتم العثور على أسماء',true);return}
    const existingNames=new Set(studentsOfClass(cls.id).map(s=>s.name.trim()));
    const unique=clean.filter(n=>!existingNames.has(n));
    if(!unique.length){toast('لا توجد أسماء جديدة',true);return}
    let start=studentsOfClass(cls.id).length+1;
    const batch=unique.map((name,i)=>({id:uid(),classId:cls.id,number:String(start+i),name}));
    store.students.push(...batch);saveStore();
    for(const st of batch) await pushToServer('saveStudent',st);
    render();toast(`تمت إضافة ${batch.length} طالبة`);
  };
  const dz=document.getElementById('manageDrop'), input=document.getElementById('manageFile'), status=document.getElementById('manageDropStatus');
  const readFile=async(file)=>{
    const ext=(file.name.split('.').pop()||'').toLowerCase(); status.textContent='جاري قراءة '+file.name+'...';
    try{
      let names=[];
      if(['xlsx','xls','ods'].includes(ext)){
        const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1});
        names=rows.flatMap(r=>r.slice(0,2)).map(v=>String(v||'').trim()).filter(v=>v);
      }else if(ext==='pdf'){
        const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise, lines=[];
        for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),ct=await page.getTextContent();let line='',lastY=null;ct.items.forEach(it=>{const y=it.transform[5];if(lastY!==null&&Math.abs(y-lastY)>2){if(line.trim())lines.push(line);line=''}line+=it.str;lastY=y});if(line.trim())lines.push(line)}
        names=cleanNameLines(lines);
      }else if(ext==='docx'){
        const res=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()}); names=cleanNameLines(res.value.split(/\r?\n/));
      }else{
        names=cleanNameLines((await file.text()).split(/\r?\n/));
      }
      await addNames(names);
    }catch(e){toast('تعذّرت قراءة الملف. تأكدي من أن الملف نصي/غير محمي.',true)}
    finally{status.textContent='';input.value=''}
  };
  dz?.addEventListener('click',()=>input.click());
  input?.addEventListener('change',e=>[...e.target.files].forEach(readFile));
  dz?.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag')});
  dz?.addEventListener('dragleave',()=>dz.classList.remove('drag'));
  dz?.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');[...e.dataTransfer.files].forEach(readFile)});
  dz?.addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');if(t){e.preventDefault();addNames([t])}});
  document.getElementById('managePasteBtn')?.addEventListener('click',()=>{const t=document.getElementById('managePaste').value;document.getElementById('managePaste').value='';addNames([t])});
}

/* ==========================================================================
   التقارير اليومية والأسبوعية والشهرية
   ========================================================================== */
function reportRange(type, startValue){
  const end = new Date(startValue + 'T00:00:00');
  let start = new Date(end);
  if(type==='daily'){
    return {start: start, end: end, label:'يومي'};
  }
  if(type==='weekly'){
    start.setDate(start.getDate()-6);
    return {start:start, end:end, label:'أسبوعي'};
  }
  start = new Date(end.getFullYear(), end.getMonth(), 1);
  const monthEnd = new Date(end.getFullYear(), end.getMonth()+1, 0);
  return {start:start, end:monthEnd, label:'شهري'};
}
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function formatDateArText(key){
  const d=new Date(key+'T00:00:00');
  return d.toLocaleDateString('ar-SA-u-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'});
}
function formatDateAr(key){
  const d=new Date(key+'T00:00:00');
  let hijri='—', greg='—';
  try{ hijri=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(d)+' هـ'; }catch(e){}
  try{ greg=new Intl.DateTimeFormat('ar-SA-u-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(d)+' م'; }catch(e){}
  return '<span class="dual-date"><span class="dual-hijri">'+esc(hijri)+'</span><span class="dual-greg">'+esc(greg)+'</span></span>';
}
function todayDateHtml(){ return formatDateAr(todayStr()); }
function reportTeacherStats(sessions){
  const map={};
  sessions.forEach(a=>{
    const name=String(a.teacher||'غير محددة').trim()||'غير محددة';
    if(!map[name]) map[name]={name,sessions:0,classes:new Set(),days:new Set(),present:0,absent:0};
    map[name].sessions++;
    if(a.classId) map[name].classes.add(a.classId);
    if(a.date) map[name].days.add(a.date);
    (a.records||[]).forEach(r=>{if(r.status==='غائب') map[name].absent++; else if(r.status==='حاضر') map[name].present++;});
  });
  return Object.values(map).sort((a,b)=>b.sessions-a.sessions || b.days.size-a.days.size || a.name.localeCompare(b.name,'ar'));
}

  return '<div class="teacher-dashboard"><div class="teacher-dashboard-head"><div><h3>👩‍🏫 لوحة المعلمين الالأكثر رصدًا</h3><p>حسب عدد عمليات الرصد في الفترة المحددة · أعلى 6 معلمات</p></div><div class="teacher-heart">💗 💗 💗</div></div><div class="teacher-grid">'+cards+'</div><div class="motivation-card">✨ '+phrase+' ✨</div></div>';
}

function reportData(type, anchor, classId){
  const range=reportRange(type,anchor);
  const from=dateKey(range.start), to=dateKey(range.end);
  const classes=visibleClasses().filter(c=>!classId || c.id===classId);
  const sessions=store.attendance.filter(a=>a.date>=from && a.date<=to && (!classId || a.classId===classId));
  const byStudent={};
  const byClass={};
  sessions.forEach(a=>{
    const cls=store.classes.find(c=>c.id===a.classId);
    if(!byClass[a.classId]) byClass[a.classId]={classId:a.classId,className:cls?cls.name:'—',days:new Set(),present:0,absent:0,total:0};
    byClass[a.classId].days.add(a.date);
    a.records.forEach(r=>{
      const key=a.classId+'|'+r.studentId;
      if(!byStudent[key]) byStudent[key]={classId:a.classId,studentId:r.studentId,name:r.studentName,days:0,present:0,absent:0};
      byStudent[key].days++;
      if(r.status==='غائب') byStudent[key].absent++; else if(r.status==='حاضر') byStudent[key].present++;
      byClass[a.classId].total++;
      if(r.status==='غائب') byClass[a.classId].absent++; else if(r.status==='حاضر') byClass[a.classId].present++;
    });
  });
  classes.forEach(c=>{ if(!byClass[c.id]) byClass[c.id]={classId:c.id,className:c.name,days:new Set(),present:0,absent:0,total:0}; });
  return {from,to,label:range.label,sessions,byStudent:Object.values(byStudent),byClass:Object.values(byClass)};
}

}
function openStudentProfileById(studentId){
  const st=store.students.find(s=>s.id===studentId);
  if(!st){ toast('تعذّر العثور على بيانات الطالب',true); return; }
  const cls=store.classes.find(c=>c.id===st.classId);
  const records=[];
  (store.attendance||[]).filter(a=>a.classId===st.classId).forEach(a=>{
    (a.records||[]).filter(r=>r.studentId===st.id).forEach(r=>records.push({date:a.date,status:r.status,teacher:a.teacher||'غير محددة',time:a.time||''}));
  });
  records.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const present=records.filter(r=>r.status==='حاضر').length, absent=records.filter(r=>r.status==='غائب').length;
  const rate=records.length?Math.round(present/records.length*100):0;
  const host=document.getElementById('modalHost')||(()=>{const d=document.createElement('div');d.id='modalHost';document.body.appendChild(d);return d;})();
  host.innerHTML='<div class="overlay student-profile-modal" id="studentProfileOv"><div class="modal wide"><div class="modal-head"><h3>👩‍🎓 ملف الطالب: '+esc(st.name)+'</h3><button class="modal-close" id="studentProfileClose">✕</button></div><div class="modal-body"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><b style="color:var(--navy)">الفصل: '+esc(cls?cls.name:'—')+'</b><span style="color:#64748b;font-size:.78rem">رقم الطالب: '+esc(st.number||'—')+'</span></div><div class="student-profile-grid"><div class="student-profile-stat"><b>'+records.length+'</b><span>أيام الرصد</span></div><div class="student-profile-stat"><b>'+present+'</b><span>حضور</span></div><div class="student-profile-stat"><b style="color:var(--danger)">'+absent+'</b><span>غياب</span></div><div class="student-profile-stat"><b>'+rate+'%</b><span>نسبة الحضور</span></div></div><h4 style="color:var(--navy);margin:8px 0 10px">📅 سجل الحضور والغياب</h4><div class="student-profile-history">'+(records.map(r=>'<div class="student-profile-history-row"><span>'+formatDateAr(r.date)+(r.time?' · '+esc(r.time):'')+' · '+esc(r.teacher)+'</span><span class="'+(r.status==='غائب'?'abs':'pres')+'">'+esc(r.status)+'</span></div>').join('')||'<div class="empty">لا يوجد سجل حضور أو غياب</div>')+'</div></div></div></div>';
  const close=()=>host.innerHTML=''; document.getElementById('studentProfileClose').onclick=close; document.getElementById('studentProfileOv').onclick=e=>{if(e.target.id==='studentProfileOv')close();};
}

function bindReports(){
  ['reportType','reportDate','reportClass'].forEach(id=>document.getElementById(id).addEventListener('change',renderReportPreview));
  document.getElementById('refreshReport').onclick=renderReportPreview;
  document.getElementById('reportPdfBtn').onclick=exportPeriodPDF;
  document.getElementById('reportExcelBtn').onclick=exportPeriodExcel;
  renderReportPreview();
  document.querySelectorAll('[data-open-student-profile]').forEach(b=>b.onclick=()=>openStudentProfileById(b.dataset.openStudentProfile));
}
function reportPrintHtml(type,anchor,classId){
  const d=reportData(type,anchor,classId);
  const totalPresent=d.byClass.reduce((n,x)=>n+x.present,0), totalAbsent=d.byClass.reduce((n,x)=>n+x.absent,0);
  const teachers=reportTeacherStats(d.sessions);
  const classRows=d.byClass.map(x=>`<tr><td>${esc(x.className)}</td><td>${x.days.size}</td><td>${x.present}</td><td>${x.absent}</td><td>${x.present+x.absent?Math.round(x.present/(x.present+x.absent)*100):0}%</td></tr>`).join('');
  const teacherRows=teachers.slice(0,6).map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name)}</td><td>${t.sessions}</td><td>${t.days.size}</td><td>${t.classes.size}</td></tr>`).join('');
  const studentRows=d.byStudent.sort((a,b)=>b.absent-a.absent).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc((store.classes.find(c=>c.id===x.classId)||{}).name||'')}</td><td>${x.days}</td><td>${x.present}</td><td>${x.absent}</td></tr>`).join('');
  return `<div style="font-family:'Cairo',Arial,sans-serif;direction:rtl;padding:18px;color:#102a43"><div style="display:flex;align-items:center;gap:18px;border-bottom:3px solid #102a43;padding-bottom:14px"><img src="school-logo.svg" style="width:85px;height:85px;object-fit:contain"><div></div></div><div style="display:flex;gap:12px;margin:18px 0"><div style="border:1px solid #ddd;background:#ecfdf5;padding:10px;flex:1;text-align:center"><b>${d.sessions.length}</b><br>أيام رصد</div><div style="border:1px solid #ddd;background:#eff6ff;padding:10px;flex:1;text-align:center"><b>${totalPresent}</b><br>حالات حضور</div><div style="border:1px solid #ddd;background:#fff7ed;padding:10px;flex:1;text-align:center"><b>${totalAbsent}</b><br>حالات غياب</div></div><div style="margin:18px 0;padding:14px;border:1px solid #f1d8df;background:linear-gradient(135deg,#fff7ed,#fdf2f8);border-radius:14px"><h3 style="margin:0 0 10px;color:#7c2d5a">👩‍🏫 المعلمين الالأكثر رصدًا 💗</h3><table style="width:100%;border-collapse:collapse" border="1" cellpadding="7"><thead><tr><th>#</th><th>المعلم</th><th>عمليات الرصد</th><th>أيام الرصد</th><th>الفصول</th></tr></thead><tbody>${teacherRows||'<tr><td colspan="5">لا توجد بيانات</td></tr>'}</tbody></table><div style="text-align:center;margin-top:10px;color:#7c2d5a;font-weight:800">💗 شكرًا لكل معلمة تسهم بمتابعتها في انتظام الطلاب 💗</div></div><h3>ملخص الفصول</h3><table style="width:100%;border-collapse:collapse" border="1" cellpadding="7"><thead><tr><th>الفصل</th><th>أيام الرصد</th><th>حضور</th><th>غياب</th><th>نسبة الحضور</th></tr></thead><tbody>${classRows||'<tr><td colspan="5">لا توجد بيانات</td></tr>'}</tbody></table><h3 style="margin-top:24px">تفصيل الطلاب</h3><table style="width:100%;border-collapse:collapse" border="1" cellpadding="7"><thead><tr><th>الطالب</th><th>الفصل</th><th>أيام الرصد</th><th>حضور</th><th>غياب</th></tr></thead><tbody>${studentRows||'<tr><td colspan="5">لا توجد بيانات</td></tr>'}</tbody></table><div style="margin-top:24px;color:#64748b;font-size:11px">تم إصدار التقرير من منصة راية لرصد الغياب</div></div>`;
}
function exportPeriodPDF(){
  renderReportPreview();
  setTimeout(()=>{
    const p=document.getElementById('reportPreview');
    let original=p.innerHTML;
    const originalWrap=document.createElement('div');
    originalWrap.innerHTML=original;
    const originalReportCard=originalWrap.querySelector('.card');
    if(originalReportCard && originalReportCard.firstElementChild){ originalReportCard.firstElementChild.remove(); }
    original=originalWrap.innerHTML;
    const type=document.getElementById('reportType').value, anchor=document.getElementById('reportDate').value||todayStr(), classId=document.getElementById('reportClass').value;
    const d=reportData(type,anchor,classId);
    const totalP=d.byClass.reduce((n,x)=>n+x.present,0), totalA=d.byClass.reduce((n,x)=>n+x.absent,0);
    const students=d.byStudent.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
    const rows=students.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc((store.classes.find(c=>c.id===x.classId)||{}).name||'')}</td><td>${x.days}</td><td>${x.present}</td><td style="color:#dc2626;font-weight:800">${x.absent}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد بيانات</td></tr>';
    let classHighlight='<span class="pdf-class-name">جميع الفصول</span>'; if(classId){ const cls=store.classes.find(c=>c.id===classId); if(cls){ classHighlight='<span class="pdf-class-number">رقم الفصل: '+esc(cls.number||'')+'</span><span class="pdf-class-name">الفصل: '+esc(cls.name)+'</span>'; } }
    p.innerHTML=`<div class="pdf-cover"><div class="pdf-main-header"><img src="school-logo.svg" class="pdf-main-logo"><div><div class="pdf-school">${esc(SCHOOL_NAME)}</div><div style="font-size:12px;font-weight:700;color:#64748b;margin-top:3px;">النوع: ${esc(SCHOOL_TYPE)} — المدير: ${esc(SCHOOL_PRINCIPAL)}</div><h1>تقرير غياب يومي - أسبوعي - شهري</h1><div class="pdf-period">من ${formatDateAr(d.from)} إلى ${formatDateAr(d.to)}</div></div></div><div class="pdf-class-highlight">${classHighlight}</div><div class="pdf-summary"><div><b>${students.length}</b><span>عدد الطلاب</span></div><div><b>${totalP}</b><span>حضور</span></div><div><b>${totalA}</b><span>غياب</span></div></div><h2>أسماء الطلاب</h2><table class="pdf-students-table"><thead><tr><th>#</th><th>اسم الطالب</th><th>الفصل</th><th>أيام الرصد</th><th>حضور</th><th>غياب</th></tr></thead><tbody>${rows}</tbody></table></div><div class="pdf-charts-page">${original}</div>`;
    window.print();
    setTimeout(()=>{p.innerHTML=original;},500);
  },120);
}
function exportPeriodExcel(){
  const type=document.getElementById('reportType').value, anchor=document.getElementById('reportDate').value||todayStr(), classId=document.getElementById('reportClass').value, d=reportData(type,anchor,classId);
  const rows=d.byStudent.map(x=>({'الطالب':x.name,'الفصل':(store.classes.find(c=>c.id===x.classId)||{}).name||'','أيام الرصد':x.days,'حضور':x.present,'غياب':x.absent}));
  const ws=XLSX.utils.json_to_sheet(rows), wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'التقرير'); XLSX.writeFile(wb,`تقرير_غياب_${d.label}_${d.from}_${d.to}.xlsx`);
}

/* ==========================================================================
   التصدير: Excel و PDF
   ========================================================================== */
function exportClassExcel(classId){
  const cls = store.classes.find(c=>c.id===classId);
  const students = studentsOfClass(classId).sort(byNumber);
  const att = attendanceOf(classId);
  const rows = students.map(s=>{
    const rec = att ? att.records.find(r=>r.studentId===s.id) : null;
    return {
      'رقم الطالب': s.number,
      'اسم الطالب': s.name,
      'الحالة': rec ? rec.status : 'لم يُرصد',
      'المعلم': att ? att.teacher : '',
      'وقت الرصد': att ? att.time : '',
      'التاريخ': todayStr()
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الغياب');
  XLSX.writeFile(wb, `تقرير_غياب_${cls.name}_${todayStr()}.xlsx`);
}
function exportClassPDF(classId){
  const cls = store.classes.find(c=>c.id===classId);
  const students = studentsOfClass(classId).sort(byNumber);
  const att = attendanceOf(classId);
  const rowsHtml = students.map(s=>{
    const rec = att ? att.records.find(r=>r.studentId===s.id) : null;
    const status = rec ? rec.status : 'لم يُرصد';
    const color = status==='غائب' ? '#dc2626' : (status==='حاضر' ? '#16a34a' : '#8299a6');
    return `<tr><td>${esc(s.number)}</td><td>${esc(s.name)}</td><td style="color:${color}; font-weight:700;">${esc(status)}</td></tr>`;
  }).join('');
  const html = `
  <div style="font-family:'Cairo',sans-serif; direction:rtl; padding:10px;">
    <h2 style="color:#102a43;">تقرير غياب — ${esc(cls.name)}</h2>
    <p style="color:#555; font-size:13px;">${esc(SCHOOL_NAME)} — التاريخ: ${todayDateHtml()} ${att? '— المعلم: '+esc(att.teacher)+' — الساعة: '+esc(att.time):''}</p>
    <table style="width:100%; border-collapse:collapse; margin-top:14px;" border="1" cellpadding="8">
      <thead style="background:#102a43; color:#fff;"><tr><th>رقم الطالب</th><th>اسم الطالب</th><th>الحالة</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  </div>`;
  printElement(html, `تقرير غياب ${cls.name}`);
}

/* ==========================================================================
   بدء التشغيل + التعامل مع رابط ?class=
   ========================================================================== */
function init(){
  if((store.attendance||[]).some(a=>a.pending)) schedulePendingRetry();
  const params = new URLSearchParams(window.location.search);
  const cid = params.get('class');
  if(cid){
    route = { name:'scanDeep', classId:cid };
    pullFromServer(false).finally(render);
  }else{
    if(session) startAutoSync();
    render();
  }
}
window.navigate = navigate;
init();
</script>
